name: Seed Database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-database
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed database
        run: npx prisma db seed
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SEED_USER_ID: ${{ secrets.SEED_USER_ID }}
          SEED_TIME_ZONE: ${{ secrets.SEED_TIME_ZONE || 'Asia/Taipei' }}
